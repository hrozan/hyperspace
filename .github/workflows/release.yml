name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            generator: Ninja
          - name: Linux
            os: ubuntu-22.04
            generator: Ninja
          # MSVC via Ninja would need the developer shell sourced first; the
          # Visual Studio generator finds the toolchain on its own.
          - name: Windows
            os: windows-2022
            generator: Visual Studio 17 2022

    steps:
      - uses: actions/checkout@v4

      # JUCE needs the X11, ALSA and FreeType development headers on Linux, and
      # pkg-configs webkit2gtk even with JUCE_WEB_BROWSER=0 — which is why this
      # job pins 22.04, the last image that still carries webkit2gtk-4.0.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev ninja-build

      - name: Set up Ninja
        if: matrix.generator == 'Ninja' && runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      # FetchContent clones JUCE on the first configure, which dominates the run.
      # Key the cache on the tag pinned in CMakeLists.txt so a bump invalidates it.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-juce-

      - name: Configure
        run: >
          cmake -B build -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DHYPERSPACE_INSTALL_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      # tar on macOS and Linux rather than zip: the .vst3 and .app are bundles of
      # symlinks and executables, and tar is the format that keeps both intact.
      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd "build/Hyperspace_artefacts/${{ env.BUILD_TYPE }}"
          tar czf "$GITHUB_WORKSPACE/Hyperspace-${{ matrix.name }}.tar.gz" \
            VST3/Hyperspace.vst3 Standalone/*

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "build/Hyperspace_artefacts/${{ env.BUILD_TYPE }}"
          Compress-Archive -Path "$src/VST3/Hyperspace.vst3", "$src/Standalone/*" `
            -DestinationPath "Hyperspace-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Hyperspace-${{ matrix.name }}
          path: |
            Hyperspace-${{ matrix.name }}.tar.gz
            Hyperspace-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    # Only a tag gets a GitHub release; a manual run just leaves the artefacts
    # attached to the workflow run.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Hyperspace ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
