name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            generator: Ninja
          - name: Linux
            os: ubuntu-24.04
            generator: Ninja
          # MSVC via Ninja would need the developer shell sourced first; the
          # Visual Studio generator finds the toolchain on its own.
          - name: Windows
            os: windows-2022
            generator: Visual Studio 17 2022

    steps:
      - uses: actions/checkout@v4

      # JUCEUtils.cmake pkg-configs libcurl, webkit2gtk and gtk at include time,
      # before any NEEDS_WEB_BROWSER / JUCE_USE_CURL setting is consulted, so
      # those three are configure-time requirements however the plugin is built.
      # It probes webkit2gtk-4.1 first and only falls back to 4.0, which is what
      # lets this run on 24.04; 4.0 was the reason to stay on 22.04. No OpenGL
      # packages: juce_opengl is not in the link list.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache ninja-build \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Set up Ninja
        if: matrix.generator == 'Ninja' && runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      # FetchContent clones JUCE on the first configure, which dominates the run.
      # Key the cache on the tag pinned in CMakeLists.txt so a bump invalidates it.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-juce-

      # Compiling JUCE itself is most of the Linux build. ccache turns that into
      # a cache lookup on every run after the first. Linux only: on macOS the
      # universal build passes two -arch flags in one invocation, which ccache
      # will not cache, and MSVC is not a ccache target at all.
      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Configure ccache
        if: runner.os == 'Linux'
        run: |
          ccache --set-config max_size=500M
          ccache --zero-stats
          echo "CMAKE_LAUNCHER=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DHYPERSPACE_INSTALL_AFTER_BUILD=OFF
          ${{ env.CMAKE_LAUNCHER }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: ccache statistics
        if: runner.os == 'Linux'
        run: ccache --show-stats

      - name: Test
        run: ctest --test-dir build --build-config ${{ env.BUILD_TYPE }} --output-on-failure

      # tar on macOS and Linux rather than zip: the .vst3 and .app are bundles of
      # symlinks and executables, and tar is the format that keeps both intact.
      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd "build/Hyperspace_artefacts/${{ env.BUILD_TYPE }}"
          tar czf "$GITHUB_WORKSPACE/Hyperspace-${{ matrix.name }}.tar.gz" \
            VST3/Hyperspace.vst3 Standalone/*

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "build/Hyperspace_artefacts/${{ env.BUILD_TYPE }}"
          Compress-Archive -Path "$src/VST3/Hyperspace.vst3", "$src/Standalone/*" `
            -DestinationPath "Hyperspace-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Hyperspace-${{ matrix.name }}
          path: |
            Hyperspace-${{ matrix.name }}.tar.gz
            Hyperspace-${{ matrix.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    # Only a tag gets a GitHub release; a manual run just leaves the artefacts
    # attached to the workflow run.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Hyperspace ${{ github.ref_name }}" \
            --generate-notes \
            dist/*
